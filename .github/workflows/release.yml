name: Release

on:
  push:
    tags:
      # GitHub tag filters are globs, not regular expressions. Keep this broad
      # and enforce strict semver in the validate job below.
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to build (for example, v1.0.0)
        required: true
        type: string
      dry_run:
        description: Build workflow artifacts without creating or changing a GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and versions
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.versions.outputs.tag }}
      dry_run: ${{ steps.versions.outputs.dry_run }}
      prerelease: ${{ steps.versions.outputs.prerelease }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate semver tag and application versions
        id: versions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
            dry_run="$DISPATCH_DRY_RUN"
          else
            tag="$PUSH_TAG"
            dry_run="false"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid v-prefixed semantic version."
            exit 1
          fi

          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null

          TAG="$tag" DRY_RUN="$dry_run" node <<'NODE'
          const fs = require("node:fs");

          const tag = process.env.TAG;
          const expected = tag.slice(1);
          const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const packageSection = cargo.split(/^\[package\]\s*$/m)[1]?.split(/^\[/m)[0];
          const cargoVersion = packageSection?.match(/^version\s*=\s*"([^"]+)"\s*$/m)?.[1];

          const versions = {
            "package.json": packageVersion,
            "src-tauri/tauri.conf.json": tauriVersion,
            "src-tauri/Cargo.toml": cargoVersion,
          };
          let valid = true;
          for (const [file, version] of Object.entries(versions)) {
            if (version !== expected) {
              console.error(`::error file=${file}::Version '${version ?? "missing"}' does not match tag '${tag}'.`);
              valid = false;
            }
          }
          if (!valid) process.exit(1);

          const output = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
          output.write(`tag=${tag}\n`);
          output.write(`dry_run=${process.env.DRY_RUN === "true"}\n`);
          output.write(`prerelease=${expected.includes("-")}\n`);
          output.end();
          NODE

  quality:
    name: Quality gate
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint, typecheck, test, and build frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Check Rust application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  create_release:
    name: Create draft release
    needs: [validate, quality]
    if: needs.validate.outputs.dry_run == 'false'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse one draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail

          if release=$(gh api "repos/$GH_REPO/releases/tags/$TAG" 2>/dev/null); then
            is_draft=$(jq -r '.draft' <<<"$release")
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::A published release already exists for $TAG; refusing to modify it."
              exit 1
            fi
            release_id=$(jq -r '.id' <<<"$release")
            echo "Reusing draft release $release_id for $TAG."
          else
            release_id=$(gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$TAG" \
              -f name="MdSheep $TAG" \
              -f body="Automated unsigned build for $TAG. See the README for platform warnings." \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              --jq '.id')
            echo "Created draft release $release_id for $TAG."
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, quality, create_release]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.quality.result == 'success' &&
      (needs.validate.outputs.dry_run == 'true' || needs.create_release.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            args: --bundles nsis,msi
            artifact: mdsheep-windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macOS universal
            runner: macos-15
            args: --target universal-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: mdsheep-macos-universal
            paths: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            artifact: mdsheep-linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          args: ${{ matrix.args }}

      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: Upload assets and publish release
    needs: [validate, create_release, build]
    if: >-
      always() &&
      needs.validate.outputs.dry_run == 'false' &&
      needs.create_release.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all platform bundles
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: mdsheep-*
          path: release-assets
          merge-multiple: true

      - name: Verify, upload, and publish the complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
        run: |
          set -euo pipefail

          for pattern in '*.exe' '*.msi' '*.dmg' '*.deb' '*.rpm' '*.AppImage'; do
            if ! find release-assets -type f -name "$pattern" -print -quit | grep -q .; then
              echo "::error::No $pattern release asset was produced."
              exit 1
            fi
          done

          release=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          current_tag=$(jq -r '.tag_name' <<<"$release")
          current_draft=$(jq -r '.draft' <<<"$release")
          if [[ "$current_tag" != "$TAG" || "$current_draft" != "true" ]]; then
            echo "::error::Release tag or draft state changed; refusing to publish."
            exit 1
          fi

          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false >/dev/null
          echo "Published $TAG with ${#assets[@]} assets."
